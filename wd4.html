<!DOCTYPE html>
<html>
<head>
    <title>CSS Types</title>

    <!-- Internal CSS -->
    <style>
        h2 {
            color: blue;
        }
    </style>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Welcome to CSS</h2>

    <p style="color: red;">This uses inline CSS.</p>

    <h3>This uses external CSS.</h3>
</body>
</html>
